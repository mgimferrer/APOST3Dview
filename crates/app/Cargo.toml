[package]
name = "apost3dview"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
apost3dview-core = { version = "0.9.0", path = "../core" }
apost3dview-render = { version = "0.9.0", path = "../render" }
eframe = { version = "0.36.1", default-features = false, features = ["wgpu", "default_fonts", "persistence", "links", "x11", "wayland"] }
egui = "0.36.1"
egui-wgpu = "0.36.1"
glam = "0.33.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4"
png = "0.18.1"
pollster = "1.0.1"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
toml = "0.9"
wgpu = "30.0.0"

[dev-dependencies]
egui_kittest = { version = "0.36.1", features = ["wgpu", "eframe"] }
eframe = { version = "0.36.1", default-features = false, features = ["wgpu", "default_fonts", "persistence", "links", "x11", "wayland"] }
serde_json = "1.0"

[build-dependencies]
winresource = "0.1"
