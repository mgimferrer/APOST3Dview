# Downloadable builds. A pushed tag vX.Y.Z (equal to the version in
# Cargo.toml) builds all three and makes a draft GitHub Release with them,
# to be checked and published by hand. Run by hand ("Run workflow"), it
# only builds: the packages are then under the run's Artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and package
        shell: pwsh
        run: |
          cargo build --release --locked -p apost3dview
          $dir = "dist/APOST3Dview-${{ needs.version.outputs.version }}-windows-x86_64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/apost3dview.exe "$dir/APOST3Dview.exe"
          Copy-Item LICENSE "$dir/LICENSE.txt"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.zip

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.dmg

  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.tar.gz

  publish:
    needs: [version, windows, macos, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/@VERSION@/${{ needs.version.outputs.version }}/g" packaging/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --draft --title "APOST3Dview ${{ needs.version.outputs.version }}" --notes-file notes.md
